<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigned Classes - Kids Roots Jand</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="stylesheet" href="style.css?v=20260603-kids-roots-jand-brand">
    <link rel="stylesheet" href="student_schedule_theme.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .class-assignment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
            gap: 0.85rem;
            align-items: end;
        }

        .class-assignment-grid label {
            display: block;
            color: #334155;
            font-size: 0.8rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
        }

        .class-assignment-grid input,
        .class-assignment-grid select {
            width: 100%;
            min-height: 38px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: #fff;
            color: #0f172a;
            padding: 0.42rem 0.62rem;
            font: inherit;
        }

        .assignment-table {
            width: 100%;
            min-width: 720px;
            border-collapse: collapse;
        }

        .assignment-table th,
        .assignment-table td {
            padding: 0.68rem;
            border-bottom: 1px solid #dbecea;
            text-align: left;
            vertical-align: middle;
        }

        .assignment-table th {
            background: #f6fbfa;
            color: #475569;
            font-size: 0.76rem;
            text-transform: uppercase;
        }

        .assignment-actions {
            display: inline-flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-section">
                <img class="sidebar-logo-img" src="images/logo.png" alt="Kids Roots Jand logo">
            </div>
            <nav class="nav-links"></nav>
            <a href="settings.html" class="user-profile">
                <div class="avatar">AD</div>
                <div class="user-info"><h4>Admin User</h4><p>Principal</p></div>
            </a>
        </aside>

        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Assigned Classes</h1>
                    <p style="color: var(--text-secondary); margin-top: 0.3rem;">Assign a teacher as class incharge.</p>
                </div>
            </header>

            <section class="schedule-panel">
                <div class="schedule-section-title">
                    <h3>Class Incharge Assignment</h3>
                    <a class="schedule-back-link" href="teacher_scheduling.html"><i data-lucide="arrow-left"></i> Back</a>
                </div>
                <form id="classAssignmentForm">
                    <input type="hidden" id="classAssignmentEditId">
                    <div class="class-assignment-grid">
                        <div>
                            <label for="classAssignmentTeacher">Teacher</label>
                            <select id="classAssignmentTeacher" required></select>
                        </div>
                        <div>
                            <label for="classAssignmentClass">Class</label>
                            <select id="classAssignmentClass" required></select>
                        </div>
                        <div>
                            <label for="classAssignmentCampus">Campus</label>
                            <select id="classAssignmentCampus" required></select>
                        </div>
                        <div>
                            <label for="classAssignmentNote">Note</label>
                            <input type="text" id="classAssignmentNote" placeholder="Optional note">
                        </div>
                        <button type="submit" class="btn btn-primary" id="saveClassAssignmentBtn"><i data-lucide="save"></i> Save Assignment</button>
                    </div>
                </form>
            </section>

            <section class="schedule-panel">
                <h3 style="margin-bottom: 1rem;">Class Incharges</h3>
                <div class="schedule-table-wrap" id="classAssignmentList"></div>
            </section>
        </main>
    </div>

    <script src="auth.js?v=20260806-auth-sync"></script>
    <script src="script.js?v=20260806-assigned-classes-refresh"></script>
    <script>
        const API_BASE_URL = (() => {
            const isLocalhost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
            const backendUrl = isLocalhost
                ? (window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin)
                : (window.ENV_BACKEND_URL || window.location.origin);
            return `${backendUrl}/api`;
        })();
        const authToken = sessionStorage.getItem('eduCore_token') || '';
        const LEGACY_CLASS_ASSIGNMENT_KEY = 'eduCore_teacher_class_assignments';

        let teacherAssignments = [];
        let teacherRecords = [];
        let classRecords = [];
        let campusRecords = [];
        const els = {
            teacher: () => document.getElementById('classAssignmentTeacher'),
            classGrade: () => document.getElementById('classAssignmentClass'),
            campus: () => document.getElementById('classAssignmentCampus'),
            note: () => document.getElementById('classAssignmentNote'),
            editId: () => document.getElementById('classAssignmentEditId'),
            form: () => document.getElementById('classAssignmentForm'),
            saveBtn: () => document.getElementById('saveClassAssignmentBtn'),
            list: () => document.getElementById('classAssignmentList')
        };

        function escapeAssignmentText(value) {
            return String(value ?? '').replace(/[&<>"']/g, (char) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[char]));
        }

        function normalizeValue(value) {
            return String(value || '').trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function uniqueValues(values = []) {
            return [...new Set(values.map((value) => String(value || '').trim()).filter(Boolean))]
                .sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' }));
        }

        function getLocalCollectionRecords(key) {
            try {
                const cached = window.__eduCoreServerCollectionCache?.get?.(key);
                if (Array.isArray(cached) && cached.length) return cached;
            } catch (_error) {
                // Ignore cache read issues.
            }

            try {
                const data = window.getData?.(key);
                if (Array.isArray(data) && data.length) return data;
            } catch (_error) {
                // Ignore local storage read issues.
            }

            return [];
        }

        function normalizeTeacherRecords(records = []) {
            const teacherMap = new Map();
            records.forEach((teacher) => {
                const value = getTeacherValue(teacher);
                const label = getTeacherLabel(teacher);
                if (!value && !label) return;
                const key = String(value || label).toLowerCase();
                if (teacherMap.has(key)) return;
                teacherMap.set(key, {
                    id: value || label,
                    fullName: label,
                    subject: teacher?.subject || '',
                    campusName: teacher?.campusName || '',
                    employeeCode: teacher?.employeeCode || '',
                    username: teacher?.username || '',
                    profileId: teacher?.profileId || teacher?.id || '',
                    email: teacher?.email || ''
                });
            });
            return Array.from(teacherMap.values()).sort((left, right) =>
                String(left.fullName || '').localeCompare(String(right.fullName || ''), undefined, { numeric: true, sensitivity: 'base' })
            );
        }

        function normalizeClassRecords(records = []) {
            return uniqueValues(records.map((item) => getClassLabel(item)).filter(Boolean));
        }

        async function collectTeacherSourceRecords() {
            const sources = [];

            try {
                const result = await fetchJson('/teachers', {
                    headers: authToken ? { Authorization: `Bearer ${authToken}` } : {}
                }, 'Teachers could not be loaded.');
                const apiTeachers = Array.isArray(result) ? result : (Array.isArray(result.teachers) ? result.teachers : []);
                sources.push(...apiTeachers);
            } catch (_error) {
                // Ignore API failures here and use cached/local fallbacks below.
            }

            sources.push(...getLocalCollectionRecords('eduCore_teachers'));

            if (!sources.length && typeof window.getData === 'function') {
                const localTeachers = window.getData('eduCore_teachers');
                if (Array.isArray(localTeachers)) sources.push(...localTeachers);
            }

            return normalizeTeacherRecords(sources);
        }

        async function collectClassSourceRecords() {
            const sources = [];

            try {
                const result = await fetchJson('/classes', {
                    headers: authToken ? { Authorization: `Bearer ${authToken}` } : {}
                }, 'Classes could not be loaded.');
                const apiClasses = Array.isArray(result) ? result : (Array.isArray(result.classes) ? result.classes : []);
                sources.push(...apiClasses);
            } catch (_error) {
                // Ignore API failures here and use cached/local fallbacks below.
            }

            sources.push(...getLocalCollectionRecords('eduCore_classes'));

            if (!sources.length && typeof window.getData === 'function') {
                const localClasses = window.getData('eduCore_classes');
                if (Array.isArray(localClasses)) sources.push(...localClasses);
            }

            if (!sources.length && typeof window.eduCoreGetClassOptions === 'function') {
                try {
                    const fallbackClasses = await window.eduCoreGetClassOptions();
                    return uniqueValues(fallbackClasses);
                } catch (_error) {
                    // Ignore fallback failures.
                }
            }

            if (!sources.length) {
                return ['Play Group', 'Nursery', 'Prep', 'Class 1', 'Class 2', 'Class 3', 'Class 4', 'Class 5', 'Class 6', 'Class 7', 'Class 8', 'Class 9', 'Class 10'];
            }

            return normalizeClassRecords(sources);
        }

        function getTeacherLabel(teacher = {}) {
            return String(teacher.fullName || teacher.name || teacher.username || teacher.employeeCode || 'Teacher').trim();
        }

        function getTeacherValue(teacher = {}) {
            return String(teacher.id || teacher.profileId || teacher.employeeCode || teacher.username || teacher.email || '').trim();
        }

        function getClassLabel(item = {}) {
            const name = String(item.name || item.className || item.classGrade || item.title || '').trim();
            const section = String(item.section || item.group || '').trim();
            return section ? `${name} (${section})` : name;
        }

        function getAssignmentClassLabel(assignment = {}) {
            return String(assignment.classGrade || assignment.className || assignment.class || '').trim();
        }

        function getAssignmentTeacherLabel(assignment = {}) {
            return String(assignment.teacherName || assignment.teacherFullName || assignment.teacherUsername || assignment.teacherEmployeeCode || '').trim();
        }

        function readLegacyAssignments() {
            try {
                const stored = JSON.parse(localStorage.getItem(LEGACY_CLASS_ASSIGNMENT_KEY) || '[]');
                return Array.isArray(stored) ? stored : [];
            } catch (_error) {
                return [];
            }
        }

        async function fetchJson(path, options = {}, errorMessage = 'Request failed.') {
            const response = await fetch(`${API_BASE_URL}${path}`, {
                cache: 'no-store',
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || result?.success === false) {
                throw new Error(result?.message || result?.error || errorMessage);
            }
            return result;
        }

        async function loadCampusOptions() {
            try {
                const serverCampuses = await loadRegisteredCampusNames();
                campusRecords = Array.isArray(serverCampuses) && serverCampuses.length
                    ? serverCampuses
                    : (typeof window.getUniqueCampusNames === 'function'
                        ? window.getUniqueCampusNames()
                        : ['Jand Campus', 'Langar Campus', 'Main Campus']);
            } catch (_error) {
                campusRecords = typeof window.getUniqueCampusNames === 'function'
                    ? window.getUniqueCampusNames()
                    : ['Jand Campus', 'Langar Campus', 'Main Campus'];
            }
            populateCampusSelect('classAssignmentCampus', campusRecords, campusRecords.length ? 'Select Campus' : 'Add campus in Branch Registration first');
            const campusSelect = els.campus();
            if (campusSelect && campusSelect.options.length && !campusSelect.value) {
                campusSelect.value = campusSelect.options[0]?.value || '';
            }
        }

        async function loadTeacherOptions() {
            const teacherSelect = els.teacher();
            if (!teacherSelect) return;
            try {
                teacherRecords = await collectTeacherSourceRecords();
            } catch (_error) {
                teacherRecords = normalizeTeacherRecords(getLocalCollectionRecords('eduCore_teachers'));
            }
            const previous = teacherSelect.value || '';
            teacherSelect.innerHTML = '<option value="">Select Teacher</option>' + teacherRecords.map((teacher) => (
                `<option value="${escapeAssignmentText(teacher.id)}">${escapeAssignmentText(teacher.fullName)}${teacher.subject ? ` - ${escapeAssignmentText(teacher.subject)}` : ''}${teacher.campusName ? ` (${escapeAssignmentText(teacher.campusName)})` : ''}</option>`
            )).join('');
            if (previous) teacherSelect.value = previous;
        }

        async function loadClassOptions() {
            const classSelect = els.classGrade();
            if (!classSelect) return;
            const classes = [];
            try {
                const records = await collectClassSourceRecords();
                records.forEach((item) => {
                    const label = String(item || '').trim();
                    if (label) classes.push(label);
                });
            } catch (_error) {
                // Keep fallback below.
            }

            classRecords = uniqueValues(classes);
            const previous = classSelect.value || '';
            classSelect.innerHTML = '<option value="">Select Class</option>' + classRecords.map((className) => (
                `<option value="${escapeAssignmentText(className)}">${escapeAssignmentText(className)}</option>`
            )).join('');
            if (previous) classSelect.value = previous;
        }

        async function loadTeacherAssignments() {
            try {
                const result = await fetchJson('/teacher-class-assignments', {}, 'Assigned classes could not be loaded.');
                teacherAssignments = Array.isArray(result)
                    ? result
                    : (Array.isArray(result.assignments)
                        ? result.assignments
                        : (Array.isArray(result.records)
                            ? result.records
                            : (Array.isArray(result.teacherClassAssignments) ? result.teacherClassAssignments : [])));
            } catch (_error) {
                const cachedAssignments = window.__eduCoreServerCollectionCache?.get?.('teacher_class_assignments');
                teacherAssignments = Array.isArray(cachedAssignments) ? cachedAssignments : [];
            }
            if (!teacherAssignments.length) {
                const legacyAssignments = readLegacyAssignments();
                if (legacyAssignments.length) {
                    try {
                        const result = await fetchJson('/teacher-class-assignments', {
                            method: 'POST',
                            headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
                            body: JSON.stringify(legacyAssignments)
                        }, 'Legacy assignments could not be migrated.');
                        teacherAssignments = Array.isArray(result.assignments) ? result.assignments : legacyAssignments;
                        localStorage.removeItem(LEGACY_CLASS_ASSIGNMENT_KEY);
                    } catch (_error) {
                        teacherAssignments = legacyAssignments;
                    }
                }
            }
            renderClassAssignments();
        }

        function renderClassAssignments() {
            const list = els.list();
            const assignments = [...teacherAssignments].sort((a, b) => {
                const left = `${getAssignmentClassLabel(a)}${getAssignmentTeacherLabel(a)}`;
                const right = `${getAssignmentClassLabel(b)}${getAssignmentTeacherLabel(b)}`;
                return left.localeCompare(right, undefined, { numeric: true, sensitivity: 'base' });
            });

            if (!assignments.length) {
                list.innerHTML = '<div class="empty-note">No class incharge assignment has been added yet.</div>';
                if (window.lucide?.createIcons) window.lucide.createIcons();
                return;
            }

            list.innerHTML = `
                <table class="assignment-table">
                    <thead><tr><th>Class</th><th>Class Incharge</th><th>Campus</th><th>Note</th><th>Action</th></tr></thead>
                    <tbody>
                        ${assignments.map((assignment) => `
                            <tr>
                                <td>${escapeAssignmentText(getAssignmentClassLabel(assignment) || '-')}</td>
                                <td>
                                    <div>${escapeAssignmentText(getAssignmentTeacherLabel(assignment) || 'Teacher')}</div>
                                    ${assignment.teacherSubject ? `<div class="muted">${escapeAssignmentText(assignment.teacherSubject)}</div>` : ''}
                                </td>
                                <td>${escapeAssignmentText(assignment.campusName || 'Main Campus')}</td>
                                <td>${escapeAssignmentText(assignment.note || '-')}</td>
                                <td>
                                    <div class="assignment-actions">
                                        <button type="button" class="schedule-action-btn edit" onclick="editClassAssignment('${escapeAssignmentText(assignment.id)}')"><i data-lucide="edit-2"></i> Edit</button>
                                        <button type="button" class="schedule-action-btn delete" onclick="deleteClassAssignment('${escapeAssignmentText(assignment.id)}')"><i data-lucide="trash-2"></i> Delete</button>
                                    </div>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            if (window.lucide?.createIcons) window.lucide.createIcons();
        }

        function resetClassAssignmentForm() {
            const form = els.form();
            const editId = els.editId();
            const saveBtn = els.saveBtn();
            const campusSelect = els.campus();
            form?.reset();
            if (editId) editId.value = '';
            if (campusSelect && campusRecords.length) campusSelect.value = campusRecords[0] || '';
            if (campusSelect) campusSelect.value = campusRecords[0] || campusSelect.value || '';
            if (saveBtn) saveBtn.innerHTML = '<i data-lucide="save"></i> Save Assignment';
            if (window.lucide?.createIcons) window.lucide.createIcons();
        }

        function resolveTeacherFromSelection(teacherId) {
            const normalized = normalizeValue(teacherId);
            return teacherRecords.find((teacher) => {
                return [
                    teacher.id,
                    teacher.profileId,
                    teacher.employeeCode,
                    teacher.username,
                    teacher.email
                ].map(normalizeValue).includes(normalized);
            }) || null;
        }

        function resolveAssignmentById(id) {
            return teacherAssignments.find((item) => String(item.id) === String(id)) || null;
        }

        function editClassAssignment(id) {
            const assignment = resolveAssignmentById(id);
            if (!assignment) return;
            const editId = els.editId();
            const teacherSelect = els.teacher();
            const classSelect = els.classGrade();
            const campusSelect = els.campus();
            const noteInput = els.note();
            const saveBtn = els.saveBtn();
            const form = els.form();
            if (editId) editId.value = assignment.id;
            if (teacherSelect) teacherSelect.value = assignment.teacherId || assignment.teacherProfileId || assignment.teacherUsername || '';
            if (classSelect) classSelect.value = getAssignmentClassLabel(assignment) || '';
            if (campusSelect) campusSelect.value = assignment.campusName || '';
            if (noteInput) noteInput.value = assignment.note || '';
            if (saveBtn) saveBtn.innerHTML = '<i data-lucide="save"></i> Update Assignment';
            form?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            if (window.lucide?.createIcons) window.lucide.createIcons();
        }

        async function deleteClassAssignment(id) {
            const confirmDelete = window.showAppConfirm
                ? await window.showAppConfirm('Delete this assigned class?', 'Delete Assignment')
                : window.confirm('Delete this assigned class?');
            if (!confirmDelete) return;

            try {
                const result = await fetchJson(`/teacher-class-assignments/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: authToken ? { Authorization: `Bearer ${authToken}` } : {}
                }, 'Assigned class could not be deleted.');
                teacherAssignments = Array.isArray(result.assignments) ? result.assignments : teacherAssignments.filter((item) => String(item.id) !== String(id));
                renderClassAssignments();
                showSuccessModal('Assignment Deleted', 'The class incharge assignment has been removed.');
            } catch (error) {
                showAppAlert(error.message || 'Assigned class could not be deleted.', 'Delete Failed');
            }
        }

        async function saveTeacherAssignmentRecord(assignment) {
            const result = await fetchJson('/teacher-class-assignments', {
                method: 'POST',
                headers: authToken ? { Authorization: `Bearer ${authToken}` } : {},
                body: JSON.stringify(assignment)
            }, 'Assigned class could not be saved.');
            teacherAssignments = Array.isArray(result.assignments)
                ? result.assignments
                : (Array.isArray(result.records) ? result.records : teacherAssignments);
        }

        const classAssignmentFormEl = els.form();
        classAssignmentFormEl?.addEventListener('submit', async (event) => {
            event.preventDefault();
            const teacherSelect = els.teacher();
            const classSelect = els.classGrade();
            const campusSelect = els.campus();
            const noteInput = els.note();
            const editIdInput = els.editId();
            const selectedTeacher = resolveTeacherFromSelection(teacherSelect?.value || '');
            const classGrade = String(classSelect?.value || '').trim();
            const campusName = String(campusSelect?.value || '').trim();
            const note = String(noteInput?.value || '').trim();

            if (!selectedTeacher || !classGrade || !campusName) {
                showAppAlert('Select a teacher, class, and campus first.', 'Missing Assignment');
                return;
            }

            const editId = String(editIdInput?.value || '').trim();
            const existing = editId
                ? resolveAssignmentById(editId)
                : teacherAssignments.find((item) => normalizeValue(getAssignmentClassLabel(item)) === normalizeValue(classGrade));

            const assignment = {
                id: existing?.id || editId || `TCLASS-${Date.now()}`,
                teacherId: selectedTeacher.id || selectedTeacher.profileId || selectedTeacher.employeeCode || selectedTeacher.username,
                teacherProfileId: selectedTeacher.profileId || selectedTeacher.id || '',
                teacherUsername: selectedTeacher.username || '',
                teacherEmployeeCode: selectedTeacher.employeeCode || '',
                teacherName: selectedTeacher.fullName || 'Teacher',
                teacherSubject: selectedTeacher.subject || '',
                classGrade,
                campusName,
                note,
                createdAt: existing?.createdAt || new Date().toISOString(),
                updatedAt: new Date().toISOString()
            };

            try {
                await saveTeacherAssignmentRecord(assignment);
                await loadTeacherAssignments();
                resetClassAssignmentForm();
                showSuccessModal('Class Assigned!', `${assignment.teacherName} is assigned as class incharge for ${assignment.classGrade}.`);
            } catch (error) {
                showAppAlert(error.message || 'Assigned class could not be saved.', 'Save Failed');
            }
        });

        async function initializePage() {
            await Promise.all([
                loadCampusOptions(),
                loadTeacherOptions(),
                loadClassOptions()
            ]);
            await loadTeacherAssignments();
            if (window.lucide?.createIcons) window.lucide.createIcons();
        }

        window.addEventListener('load', initializePage);
    </script>
</body>

</html>
